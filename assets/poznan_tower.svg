<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 440" width="380" height="440" role="img" aria-label="Poznań Town Hall Tower with Trumpeter and Animated Koziołki">
  <defs>
    <!-- Gradients -->
    <linearGradient id="towerWallGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="30%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="spireCopperGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E3A5F"/>
      <stop offset="40%" stop-color="#2D5A88"/>
      <stop offset="70%" stop-color="#2350A9"/>
      <stop offset="100%" stop-color="#173563"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <linearGradient id="clockDialGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>

    <filter id="shadowFilter" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>

    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    /* CSS Animations */
    @keyframes goatLeftButt {
      0%, 10%, 100% {
        transform: translate(0px, 0px) rotate(0deg);
      }
      18% {
        transform: translate(-5px, 2px) rotate(-6deg);
      }
      26% {
        transform: translate(11px, -3px) rotate(8deg);
      }
      34% {
        transform: translate(0px, 0px) rotate(0deg);
      }
      42% {
        transform: translate(-5px, 2px) rotate(-6deg);
      }
      50% {
        transform: translate(11px, -3px) rotate(8deg);
      }
      58% {
        transform: translate(0px, 0px) rotate(0deg);
      }
      66% {
        transform: translate(-5px, 2px) rotate(-6deg);
      }
      74% {
        transform: translate(11px, -3px) rotate(8deg);
      }
      82%, 92% {
        transform: translate(0px, 0px) rotate(0deg);
      }
    }

    @keyframes goatRightButt {
      0%, 10%, 100% {
        transform: translate(0px, 0px) rotate(0deg);
      }
      18% {
        transform: translate(5px, 2px) rotate(6deg);
      }
      26% {
        transform: translate(-11px, -3px) rotate(-8deg);
      }
      34% {
        transform: translate(0px, 0px) rotate(0deg);
      }
      42% {
        transform: translate(5px, 2px) rotate(6deg);
      }
      50% {
        transform: translate(-11px, -3px) rotate(-8deg);
      }
      58% {
        transform: translate(0px, 0px) rotate(0deg);
      }
      66% {
        transform: translate(5px, 2px) rotate(6deg);
      }
      74% {
        transform: translate(-11px, -3px) rotate(-8deg);
      }
      82%, 92% {
        transform: translate(0px, 0px) rotate(0deg);
      }
    }

    @keyframes clashSpark {
      0%, 24%, 30%, 48%, 54%, 72%, 78%, 100% {
        opacity: 0;
        transform: scale(0.2);
      }
      26%, 50%, 74% {
        opacity: 1;
        transform: scale(1.3);
      }
    }

    @keyframes noteFloat1 {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.6);
      }
      20% {
        opacity: 0.9;
      }
      80% {
        opacity: 0.8;
      }
      100% {
        opacity: 0;
        transform: translate(18px, -24px) scale(1.1);
      }
    }

    @keyframes noteFloat2 {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.6);
      }
      30% {
        opacity: 0.9;
      }
      80% {
        opacity: 0.8;
      }
      100% {
        opacity: 0;
        transform: translate(-14px, -28px) scale(1.1);
      }
    }

    @keyframes trumpeterBreath {
      0%, 100% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(-1.5deg);
      }
    }

    .goat-left {
      transform-origin: 165px 235px;
      animation: goatLeftButt 5.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }

    .goat-right {
      transform-origin: 215px 235px;
      animation: goatRightButt 5.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
    }

    .clash-star {
      transform-origin: 190px 212px;
      animation: clashSpark 5.5s infinite ease-out;
    }

    .trumpeter-group {
      transform-origin: 200px 105px;
      animation: trumpeterBreath 3s infinite ease-in-out;
    }

    .music-note-1 {
      animation: noteFloat1 2.8s infinite linear;
    }

    .music-note-2 {
      animation: noteFloat2 3.2s infinite linear 1.2s;
    }
  </style>

  <!-- BACKGROUND GLOW / AURA -->
  <circle cx="190" cy="220" r="160" fill="#00ADEF" opacity="0.07" filter="url(#glowFilter)"/>

  <!-- ============================================== -->
  <!-- 1. TOWER ARCHITECTURE -->
  <!-- ============================================== -->

  <!-- Main Tower Body (Lower & Middle Tiers) -->
  <g id="tower-body">
    <!-- Base / Cornice -->
    <rect x="100" y="380" width="180" height="40" rx="3" fill="url(#towerWallGrad)" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="90" y="415" width="200" height="15" rx="2" fill="#2350A9"/>

    <!-- Decorative Base Arch / Doorway -->
    <path d="M 160 420 A 30 30 0 0 1 220 420 Z" fill="#0F2B66"/>
    <circle cx="190" cy="405" r="5" fill="url(#goldGrad)"/>

    <!-- Clock Tier (Middle Body) -->
    <rect x="110" y="240" width="160" height="142" fill="url(#towerWallGrad)" stroke="#CBD5E1" stroke-width="1.5" filter="url(#shadowFilter)"/>

    <!-- Renaissance Side Pilasters & Cornices -->
    <rect x="106" y="240" width="10" height="142" fill="#E2E8F0" stroke="#94A3B8" stroke-width="0.5"/>
    <rect x="264" y="240" width="10" height="142" fill="#CBD5E1" stroke="#94A3B8" stroke-width="0.5"/>
    <rect x="102" y="375" width="176" height="8" fill="#2350A9" rx="1"/>
    <rect x="104" y="236" width="172" height="7" fill="#2350A9" rx="1"/>

    <!-- ============================================== -->
    <!-- CLOCK FACE (Points to 12:00!) -->
    <!-- ============================================== -->
    <g id="clock" transform="translate(190, 310)">
      <!-- Outer Gold Ring -->
      <circle cx="0" cy="0" r="48" fill="url(#goldGrad)" stroke="#B45309" stroke-width="2" filter="url(#shadowFilter)"/>
      <!-- Inner Dark Blue Rim -->
      <circle cx="0" cy="0" r="43" fill="#2350A9"/>
      <!-- Dial Face -->
      <circle cx="0" cy="0" r="38" fill="url(#clockDialGrad)"/>

      <!-- Hour markers -->
      <g fill="#2350A9">
        <circle cx="0" cy="-32" r="2.5"/>  <!-- 12 -->
        <circle cx="16" cy="-28" r="1.5"/> <!-- 1 -->
        <circle cx="28" cy="-16" r="1.5"/> <!-- 2 -->
        <circle cx="32" cy="0" r="2.5"/>   <!-- 3 -->
        <circle cx="28" cy="16" r="1.5"/>  <!-- 4 -->
        <circle cx="16" cy="28" r="1.5"/>  <!-- 5 -->
        <circle cx="0" cy="32" r="2.5"/>   <!-- 6 -->
        <circle cx="-16" cy="28" r="1.5"/> <!-- 7 -->
        <circle cx="-28" cy="16" r="1.5"/> <!-- 8 -->
        <circle cx="-32" cy="0" r="2.5"/>  <!-- 9 -->
        <circle cx="-28" cy="-16" r="1.5"/><!-- 10 -->
        <circle cx="-16" cy="-28" r="1.5"/><!-- 11 -->
      </g>

      <!-- Clock Hands at 12:00 Sharp -->
      <line x1="0" y1="3" x2="0" y2="-27" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/> <!-- Minute hand -->
      <line x1="0" y1="2" x2="0" y2="-20" stroke="#2350A9" stroke-width="4.5" stroke-linecap="round"/> <!-- Hour hand -->
      <circle cx="0" cy="0" r="4" fill="url(#goldGrad)" stroke="#B45309" stroke-width="1"/>
    </g>

    <!-- ============================================== -->
    <!-- GOATS' NICHE / BALCONY (Above Clock) -->
    <!-- ============================================== -->
    <!-- Niche recess -->
    <rect x="135" y="165" width="110" height="72" rx="4" fill="#0F2B66"/>
    <!-- Renaissance Arch Frame -->
    <path d="M 135 237 L 135 185 Q 190 148 245 185 L 245 237 Z" fill="#173B82"/>
    <path d="M 138 237 L 138 187 Q 190 152 242 187 L 242 237 Z" fill="#0B1B3D"/>

    <!-- Dual Arched Little Doors where goats live -->
    <path d="M 144 236 L 144 195 A 18 18 0 0 1 182 195 L 182 236 Z" fill="#162A53" stroke="#2350A9" stroke-width="1.5"/>
    <path d="M 198 236 L 198 195 A 18 18 0 0 1 236 195 L 236 236 Z" fill="#162A53" stroke="#2350A9" stroke-width="1.5"/>

    <!-- Small Stage Balustrade Ledge -->
    <rect x="130" y="233" width="120" height="6" fill="url(#goldGrad)" rx="1"/>
    <rect x="133" y="238" width="114" height="4" fill="#CBD5E1"/>
  </g>

  <!-- ============================================== -->
  <!-- 2. ANIMATED GOATS (POZNAŃSKIE KOZIOŁKI) -->
  <!-- ============================================== -->
  <g id="koziolki">
    <!-- LEFT GOAT -->
    <g class="goat-left">
      <!-- Goat Body -->
      <path d="M 150 226 Q 158 221 168 223 Q 173 228 171 234 Q 163 236 153 234 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
      <!-- Legs (hind & front) -->
      <line x1="153" y1="233" x2="151" y2="238" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="158" y1="234" x2="157" y2="238" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="168" y1="234" x2="171" y2="238" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="172" y1="233" x2="176" y2="238" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Small Tail -->
      <path d="M 148 226 Q 144 223 146 220" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Goat Neck & Head -->
      <path d="M 166 225 L 174 213 L 182 215 L 178 225 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
      <circle cx="180" cy="214" r="5" fill="#FFFFFF" stroke="#64748B" stroke-width="0.8"/>
      <!-- Eye -->
      <circle cx="178" cy="213" r="1.2" fill="#0F172A"/>
      <!-- Snout -->
      <ellipse cx="184" cy="216" rx="3" ry="2.2" fill="#E2E8F0"/>
      <!-- Little Goatee Beard -->
      <path d="M 183 218 L 186 224 L 181 220 Z" fill="#CBD5E1"/>
      <!-- Ear -->
      <path d="M 174 212 Q 170 209 172 206" stroke="#94A3B8" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <!-- Curved Horn -->
      <path d="M 176 211 Q 175 198 185 197 Q 189 203 180 210" fill="url(#goldGrad)" stroke="#B45309" stroke-width="1"/>
      <!-- Horn Ridge Details -->
      <line x1="178" y1="202" x2="182" y2="204" stroke="#92400E" stroke-width="0.8"/>
      <line x1="180" y1="206" x2="183" y2="208" stroke="#92400E" stroke-width="0.8"/>
    </g>

    <!-- RIGHT GOAT (Mirrored, facing Left) -->
    <g class="goat-right">
      <!-- Goat Body -->
      <path d="M 230 226 Q 222 221 212 223 Q 207 228 209 234 Q 217 236 227 234 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
      <!-- Legs -->
      <line x1="227" y1="233" x2="229" y2="238" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="222" y1="234" x2="223" y2="238" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="212" y1="234" x2="209" y2="238" stroke="#475569" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="208" y1="233" x2="204" y2="238" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>
      <!-- Small Tail -->
      <path d="M 232 226 Q 236 223 234 220" stroke="#E2E8F0" stroke-width="2.5" stroke-linecap="round" fill="none"/>
      <!-- Neck & Head -->
      <path d="M 214 225 L 206 213 L 198 215 L 202 225 Z" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1"/>
      <circle cx="200" cy="214" r="5" fill="#FFFFFF" stroke="#64748B" stroke-width="0.8"/>
      <!-- Eye -->
      <circle cx="202" cy="213" r="1.2" fill="#0F172A"/>
      <!-- Snout -->
      <ellipse cx="196" cy="216" rx="3" ry="2.2" fill="#E2E8F0"/>
      <!-- Goatee Beard -->
      <path d="M 197 218 L 194 224 L 199 220 Z" fill="#CBD5E1"/>
      <!-- Ear -->
      <path d="M 206 212 Q 210 209 208 206" stroke="#94A3B8" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <!-- Curved Horn -->
      <path d="M 204 211 Q 205 198 195 197 Q 191 203 200 210" fill="url(#goldGrad)" stroke="#B45309" stroke-width="1"/>
      <!-- Horn Ridge Details -->
      <line x1="202" y1="202" x2="198" y2="204" stroke="#92400E" stroke-width="0.8"/>
      <line x1="200" y1="206" x2="197" y2="208" stroke="#92400E" stroke-width="0.8"/>
    </g>

    <!-- IMPACT SPARK / CLASH EFFECT (Centered between horns) -->
    <g class="clash-star">
      <path d="M 190 202 L 193 208 L 200 209 L 194 214 L 196 221 L 190 216 L 184 221 L 186 214 L 180 209 L 187 208 Z" fill="#00ADEF" stroke="#FFFFFF" stroke-width="1" filter="url(#glowFilter)"/>
      <circle cx="190" cy="212" r="3.5" fill="#FDE047"/>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- 3. UPPER GALLERY & BALUSTRADE -->
  <!-- ============================================== -->
  <g id="upper-gallery">
    <!-- Balcony base and arcade -->
    <rect x="125" y="145" width="130" height="18" fill="url(#towerWallGrad)" stroke="#CBD5E1" stroke-width="1"/>
    <!-- Decorative brackets -->
    <path d="M 130 163 L 138 163 L 134 172 Z" fill="#2350A9"/>
    <path d="M 160 163 L 168 163 L 164 172 Z" fill="#2350A9"/>
    <path d="M 186 163 L 194 163 L 190 172 Z" fill="#2350A9"/>
    <path d="M 212 163 L 220 163 L 216 172 Z" fill="#2350A9"/>
    <path d="M 242 163 L 250 163 L 246 172 Z" fill="#2350A9"/>

    <!-- Balustrade Pillars -->
    <rect x="130" y="125" width="120" height="20" fill="url(#towerWallGrad)" stroke="#CBD5E1" stroke-width="1"/>
    <!-- Arch openings in balustrade -->
    <g fill="#0F2B66">
      <rect x="136" y="130" width="8" height="12" rx="3"/>
      <rect x="150" y="130" width="8" height="12" rx="3"/>
      <rect x="164" y="130" width="8" height="12" rx="3"/>
      <rect x="178" y="130" width="8" height="12" rx="3"/>
      <rect x="194" y="130" width="8" height="12" rx="3"/>
      <rect x="208" y="130" width="8" height="12" rx="3"/>
      <rect x="222" y="130" width="8" height="12" rx="3"/>
      <rect x="236" y="130" width="8" height="12" rx="3"/>
    </g>

    <!-- Railing Top Cap -->
    <rect x="126" y="122" width="128" height="4" fill="url(#goldGrad)" rx="1"/>
  </g>

  <!-- ============================================== -->
  <!-- 4. THE TRUMPETER (TRĘBACZ / HEJNALISTA) -->
  <!-- ============================================== -->
  <g class="trumpeter-group">
    <!-- Standing on Tower Balcony -->
    <!-- Legs in historic dark navy hose -->
    <line x1="192" y1="123" x2="192" y2="133" stroke="#0F2B66" stroke-width="3" stroke-linecap="round"/>
    <line x1="199" y1="123" x2="201" y2="133" stroke="#0F2B66" stroke-width="3" stroke-linecap="round"/>

    <!-- Historic Tunic (Poznań Royal Blue with Gold Trim) -->
    <path d="M 188 108 L 203 108 L 206 124 L 186 124 Z" fill="#2350A9" stroke="#173B82" stroke-width="1"/>
    <!-- Gold Sash/Belt -->
    <rect x="187" y="117" width="18" height="2.5" fill="url(#goldGrad)"/>

    <!-- Head & Face -->
    <circle cx="196" cy="98" r="6.5" fill="#FBCFE8"/>
    <!-- Beard & mustache -->
    <path d="M 197 101 Q 200 105 203 102" stroke="#78350F" stroke-width="1.5" fill="none"/>
    <!-- Eye -->
    <circle cx="199" cy="97" r="0.9" fill="#0F172A"/>

    <!-- Historic Renaissance Beret / Cap with White & Cyan Feather -->
    <ellipse cx="195" cy="93" rx="7" ry="3" fill="#1E3A5F"/>
    <circle cx="194" cy="92" r="3" fill="#00ADEF"/>
    <path d="M 194 92 Q 186 85 188 78" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Right Arm holding Trumpet -->
    <path d="M 198 110 Q 206 106 211 101" stroke="#2350A9" stroke-width="3.5" fill="none" stroke-linecap="round"/>

    <!-- Golden Trumpet (pointed toward sky/right) -->
    <!-- Mouthpiece at lips -->
    <line x1="202" y1="99" x2="208" y2="98" stroke="#CA8A04" stroke-width="1.5"/>
    <!-- Trumpet Pipe Body -->
    <line x1="207" y1="98" x2="235" y2="91" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <line x1="214" y1="96" x2="214" y2="102" stroke="#CA8A04" stroke-width="1.5"/> <!-- Valve / loop -->
    <line x1="220" y1="95" x2="220" y2="101" stroke="#CA8A04" stroke-width="1.5"/>
    <!-- Trumpet Bell Flare -->
    <path d="M 233 91 L 243 86 L 243 96 Z" fill="url(#goldGrad)" stroke="#B45309" stroke-width="0.8"/>

    <!-- Decorative Poznań Banner hanging from Trumpet -->
    <path d="M 215 97 L 230 93 L 230 110 L 222 106 L 215 110 Z" fill="#00ADEF" stroke="#0284C7" stroke-width="0.8"/>
    <!-- Star on Banner -->
    <circle cx="222" cy="101" r="2" fill="#FFFFFF"/>

    <!-- Animated Musical Notes coming from Trumpet -->
    <g class="music-note-1" transform="translate(247, 85)">
      <text font-family="Arial, sans-serif" font-size="16" fill="#00ADEF" font-weight="bold">♪</text>
    </g>
    <g class="music-note-2" transform="translate(254, 76)">
      <text font-family="Arial, sans-serif" font-size="14" fill="#EAB308" font-weight="bold">♫</text>
    </g>
  </g>

  <!-- ============================================== -->
  <!-- 5. TOWER SPIRE & TOP HELMET (RENAISSANCE PEAK) -->
  <!-- ============================================== -->
  <g id="spire">
    <!-- Spire Roof / Octagonal Lantern -->
    <path d="M 140 122 L 155 70 L 225 70 L 240 122 Z" fill="url(#spireCopperGrad)" stroke="#0F2B66" stroke-width="1.5" filter="url(#shadowFilter)"/>
    <!-- Lantern Gallery Openings -->
    <rect x="175" y="76" width="30" height="24" rx="12" fill="#0F2B66" stroke="#2350A9" stroke-width="1"/>
    <!-- Spire Peak Cone -->
    <path d="M 165 70 L 190 20 L 215 70 Z" fill="url(#spireCopperGrad)" stroke="#0F2B66" stroke-width="1.5"/>

    <!-- High Finial Spire Needle -->
    <line x1="190" y1="20" x2="190" y2="4" stroke="url(#goldGrad)" stroke-width="2.5"/>

    <!-- Top Golden Sphere -->
    <circle cx="190" cy="12" r="5" fill="url(#goldGrad)" stroke="#B45309" stroke-width="1" filter="url(#glowFilter)"/>

    <!-- Weather Vane / Polish Crown Finial -->
    <path d="M 190 4 L 202 2 L 194 8 Z" fill="url(#goldGrad)"/>
    <circle cx="190" cy="3" r="2" fill="#00ADEF"/>
  </g>
</svg>
